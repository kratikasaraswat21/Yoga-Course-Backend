<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Access Update</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f7; color: #333333; font-family: Arial, Helvetica, sans-serif">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="padding: 40px 15px; background-color: #f4f4f7">
      <tr>
        <td align="center">
          <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="max-width: 560px; overflow: hidden; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08)">
            <tr>
              <td align="center" style="padding: 30px 20px; background-color: #6c5ce7; color: #ffffff">
                <h1 style="margin: 0; font-size: 26px; line-height: 1.3">Course Access Update</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 35px 30px">
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6">Hello <strong>{{USER_NAME}}</strong>,</p>
                <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.6">Congratulations! Your access has been restored for the course below:</p>
                <p style="margin: 0 0 20px; color: #6c5ce7; font-size: 20px; font-weight: bold; line-height: 1.4">{{COURSE_TITLE}}</p>
                <p style="margin: 25px 0 0; font-size: 15px; line-height: 1.6">You can now access this course again. Happy learning!</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 20px; background-color: #fafafa; color: #999999; font-size: 13px; line-height: 1.5">© 2026 Yoga Course Platform. All rights reserved.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
